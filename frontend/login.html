<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In / Switch Profile - PillPing: CareCircle</title>
  <link rel="stylesheet" href="./css/style.css">
  <style>
    .login-container {
      max-width: 480px;
      margin: 60px auto;
      padding: 0 20px;
    }
    .login-box {
      background: #ffffff;
      border-radius: var(--radius-lg);
      padding: 36px 32px;
      box-shadow: var(--shadow-lg);
      border: 1px solid var(--border-color);
    }
    .role-tabs {
      display: flex;
      background: #f1f5f9;
      padding: 4px;
      border-radius: var(--radius-sm);
      margin-bottom: 24px;
    }
    .role-tab-btn {
      flex: 1;
      padding: 10px;
      border: none;
      background: transparent;
      font-weight: 700;
      color: #64748b;
      cursor: pointer;
      border-radius: 6px;
      transition: all 0.2s ease;
    }
    .role-tab-btn.active {
      background: #ffffff;
      color: var(--primary);
      box-shadow: var(--shadow-sm);
    }
    .form-group {
      margin-bottom: 18px;
    }
    .form-label {
      display: block;
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 6px;
    }
    .form-input {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid var(--border-color);
      border-radius: var(--radius-sm);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s ease;
    }
    .form-input:focus {
      border-color: var(--border-focus);
    }
    .demo-preset-card {
      background: #f8fafc;
      border: 1px dashed #cbd5e1;
      border-radius: var(--radius-sm);
      padding: 16px;
      margin-top: 24px;
    }
  </style>
</head>
<body>

  <header class="navbar">
    <a href="./index.html" class="brand-logo">
      <div class="brand-icon">💊</div>
      <div>PillPing <span style="font-weight:400; color:var(--text-muted); font-size:1.1rem;">CareCircle</span></div>
    </a>
    <a href="./index.html" class="btn btn-outline" style="padding:6px 14px; font-size:0.88rem;">← Home Portal</a>
  </header>

  <div class="login-container">
    <div class="login-box">
      <div style="text-align:center; margin-bottom:24px;">
        <h2 style="font-size:1.6rem; font-weight:800; color:var(--text-main);">Welcome Back</h2>
        <p style="color:var(--text-muted); font-size:0.9rem;">Select your role to access the interface</p>
      </div>

      <!-- Role Tabs -->
      <div class="role-tabs">
        <button id="tab-caregiver" class="role-tab-btn active" onclick="switchRole('caregiver')">Caregiver Portal</button>
        <button id="tab-patient" class="role-tab-btn" onclick="switchRole('patient')">Senior Patient</button>
      </div>

      <!-- Caregiver Form -->
      <form id="caregiver-form" onsubmit="handleFormSubmit(event, 'caregiver')">
        <div class="form-group">
          <label class="form-label">Caregiver Account</label>
          <input type="email" id="cg-email" class="form-input" value="ananya.rao@carecircle.org" required>
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" id="cg-pass" class="form-input" value="••••••••" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%; padding:12px; font-weight:700; border-radius:10px;">
          Open Caregiver Dashboard
        </button>
      </form>

      <!-- Patient Form -->
      <form id="patient-form" style="display:none;" onsubmit="handleFormSubmit(event, 'patient')">
        <div class="form-group">
          <label class="form-label">Select Patient Profile</label>
          <select id="pt-id" class="form-input">
            <option value="1">Ramachandra Rao (Age 74 - Hypertension & Diabetes)</option>
            <option value="2">Savitri Devi (Age 79 - Osteoarthritis & Arrhythmia)</option>
          </select>
        </div>
        <button type="submit" class="btn btn-success" style="width:100%; padding:14px; font-weight:800; font-size:1.1rem; border-radius:12px;">
          🧓 Launch Senior Reminder Screen
        </button>
      </form>

      <!-- 1-Click Instant Demo Launch -->
      <div class="demo-preset-card">
        <div style="font-size:0.8rem; font-weight:800; color:#475569; text-transform:uppercase; margin-bottom:10px; display:flex; align-items:center; gap:6px;">
          <span>⚡</span> <span>1-Click Instant Demo Profiles</span>
        </div>
        <div style="display:flex; flex-direction:column; gap:8px;">
          <button class="btn btn-outline" style="width:100%; font-size:0.85rem; padding:8px 12px; text-align:left; justify-content:flex-start;" onclick="window.AuthService.quickLogin('caregiver')">
            🩺 <strong>Caregiver View:</strong> Ananya Rao (Daughter)
          </button>
          <button class="btn btn-outline" style="width:100%; font-size:0.85rem; padding:8px 12px; text-align:left; justify-content:flex-start;" onclick="window.AuthService.quickLogin('patient', 1)">
            🧓 <strong>Senior Patient 1:</strong> Ramachandra Rao (Age 74)
          </button>
          <button class="btn btn-outline" style="width:100%; font-size:0.85rem; padding:8px 12px; text-align:left; justify-content:flex-start;" onclick="window.AuthService.quickLogin('patient', 2)">
            👵 <strong>Senior Patient 2:</strong> Savitri Devi (Age 79)
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="./js/store.js"></script>
  <script src="./js/auth.js"></script>
  <script>
    let activeRole = 'caregiver';

    function switchRole(role) {
      activeRole = role;
      document.getElementById('tab-caregiver').className = `role-tab-btn ${role === 'caregiver' ? 'active' : ''}`;
      document.getElementById('tab-patient').className = `role-tab-btn ${role === 'patient' ? 'active' : ''}`;
      document.getElementById('caregiver-form').style.display = role === 'caregiver' ? 'block' : 'none';
      document.getElementById('patient-form').style.display = role === 'patient' ? 'block' : 'none';
    }

    function handleFormSubmit(e, role) {
      e.preventDefault();
      if (role === 'caregiver') {
        const email = document.getElementById('cg-email').value;
        window.AuthService.login('caregiver', { email });
      } else {
        const patientId = document.getElementById('pt-id').value;
        window.AuthService.login('patient', { patientId });
      }
    }
  </script>
</body>
</html>
