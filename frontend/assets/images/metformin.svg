<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="whiteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
  </defs>
  <!-- Capsule Body -->
  <g transform="rotate(-30 50 50)">
    <!-- Top Half -->
    <path d="M 32 30 C 32 18, 68 18, 68 30 L 68 50 L 32 50 Z" fill="url(#blueGrad)" />
    <!-- Bottom Half -->
    <path d="M 32 50 L 68 50 L 68 70 C 68 82, 32 82, 32 70 Z" fill="url(#whiteGrad)" stroke="#cbd5e1" stroke-width="1" />
    <!-- Center Line -->
    <line x1="32" y1="50" x2="68" y2="50" stroke="#1e293b" stroke-width="2" opacity="0.4" />
    <!-- Highlight shine -->
    <path d="M 38 25 C 38 22, 44 20, 50 20 L 50 78 C 45 78, 38 75, 38 72 Z" fill="#ffffff" opacity="0.3" />
  </g>
</svg>
