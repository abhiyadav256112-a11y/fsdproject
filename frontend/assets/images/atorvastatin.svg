  </defs>
  <!-- Round Tablet -->
  <circle cx="50" cy="50" r="32" fill="url(#roundGrad)" stroke="#f59e0b" stroke-width="2" />
  <ellipse cx="50" cy="50" rx="27" ry="27" fill="none" stroke="#fef3c7" stroke-width="1.5" opacity="0.6" />
  <!-- Score mark in center -->
  <line x1="28" y1="50" x2="72" y2="50" stroke="#78350f" stroke-width="2" stroke-linecap="round" />
  <ellipse cx="42" cy="38" rx="8" ry="4" fill="#ffffff" opacity="0.4" />
