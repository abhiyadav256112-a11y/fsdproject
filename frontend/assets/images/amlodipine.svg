<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="yellowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#fde047" />
    </linearGradient>
  </defs>
  <!-- Capsule Body -->
  <g transform="rotate(45 50 50)">
    <!-- Top Half -->
    <path d="M 32 30 C 32 18, 68 18, 68 30 L 68 50 L 32 50 Z" fill="url(#emeraldGrad)" />
    <!-- Bottom Half -->
    <path d="M 32 50 L 68 50 L 68 70 C 68 82, 32 82, 32 70 Z" fill="url(#yellowGrad)" stroke="#facc15" stroke-width="1" />
    <line x1="32" y1="50" x2="68" y2="50" stroke="#065f46" stroke-width="1.5" />
    <ellipse cx="50" cy="30" rx="8" ry="4" fill="#ffffff" opacity="0.4" />
  </g>
</svg>
